name: Stack Map lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check workflows and code for leaked keys and open doors
        run: node scripts/stack-map-lint.mjs
      - name: App has the latest workflows
        run: node scripts/embed-workflows.mjs --check
